[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "image-classifier-lab"
version = "1.1.1"
description = "A Streamlit curriculum for teaching how an image classifier learns."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "John Amodeo" }]
keywords = [
    "image-classification",
    "transfer-learning",
    "pytorch",
    "streamlit",
    "education",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "coremltools>=8.0",
    "torch>=2.2",
    "torchvision>=0.17",
    "streamlit>=1.42",
    "matplotlib>=3.8",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/jmamodeo/image-classifier-lab"
Changelog = "https://github.com/jmamodeo/image-classifier-lab/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["image_classifier_lab*"]

[tool.setuptools.package-data]
image_classifier_lab = ["content/README.md", "content/**/*.toml"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["image_classifier_lab", "tests", "main.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["image_classifier_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"

[tool.coverage.run]
source = ["image_classifier_lab"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
